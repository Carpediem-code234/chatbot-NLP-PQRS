[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pqrs-nlp"
version = "0.1.0"
description = "Clasificación experimental de intenciones PQRS con datos sintéticos"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "python-docx>=1.1", "ipykernel>=6.29"]

[tool.setuptools.packages.find]
where = ["src"]
