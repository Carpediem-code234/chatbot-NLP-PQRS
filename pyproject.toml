[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pqrs-nlp"
version = "0.1.0"
description = "Clasificación experimental de intenciones PQRS con datos sintéticos"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.1",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "joblib==1.6.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "python-docx==1.2.0", "ipykernel==7.4.0", "pre-commit==4.7.0"]

[tool.setuptools.packages.find]
where = ["src"]
